wfspec_name: events-demo
wfspec_version: 1.0.0

# Demonstrates the event bus: `emit_event` publishes, `wait_for` consumes.
#
# wait_for blocks until a matching event arrives or timeout_sec elapses. On
# timeout it returns None rather than failing -- always check the result.
#
# Matching narrows in three stages, all optional:
#   topic             the channel; defaults to "default"
#   event_type        the event name within the topic
#   match_expression  a predicate over the event, for picking one of many
#
# An event is consumed by the FIRST matching waiter. A second wait_for on the
# same event will time out.
#
# Three producers are shown:
#   1. an async child workflow emitting back to its parent
#   2. an async_mode activity, whose completion is published as an ordinary
#      event keyed by a token (see ../async-activity-demo for the full story)
#   3. nothing at all -- the timeout path

tags: [moco-demo, level-5-events]

context:
  # Emitting to yourself needs your own workflow id as the target.
  self_id:

input_data:
  order_id: ORD-77

output_name: report

body:
  sequence:
    elements:
      - transform:
          name: resolve-self-id
          output_data:
            - self_id#: '{{ __sys_info__.get("workflow_id") }}'

      # --- 1. async child workflow emits back to the parent ------------------
      # child_mode: async means the parent does not wait here; it waits below,
      # on the event. Starting the producer BEFORE the wait_for is important --
      # see the note about ordering at the bottom of this file.
      - workflow:
          name: start-fulfilment
          child_mode: async
          wfspec:
            content#literal: |
              wfspec_name: events-demo-fulfilment
              wfspec_version: 1.0.0
              input_data:
                order_id:
                reply_to:
              body:
                sequence:
                  elements:
                    - activity:
                        name: do-the-work
                        type: builtin.delay
                        input_data:
                          duration: 1s
                    - emit_event:
                        name: publish-fulfilled
                        input_data:
                          topic: order_events
                          event_type: fulfilled
                          target_workflow_id: '{{ reply_to }}'
                          data:
                            order_id: '{{ order_id }}'
                            status: shipped
          input_data:
            order_id: '{{ order_id }}'
            reply_to: '{{ self_id }}'

      # Wait for that specific order. match_expression guards against picking up
      # an event meant for a different order on the same topic.
      - wait_for:
          name: await-fulfilment
          event:
            topic: order_events
            event_type: fulfilled
            match_expression: '{{ event.get("data", {}).get("order_id") == order_id }}'
          timeout_sec: 30
          output_name: fulfilment_event

      - transform:
          name: read-fulfilment
          output_data:
            - fulfilment#: '{{ fulfilment_event.get("data") if fulfilment_event else None }}'

      # --- 2. async_mode activity: completion arrives as an event ------------
      # With async_mode the activity does not block; it returns a token, and the
      # engine publishes the result later as an event whose event_type IS that
      # token ("async-activity:<activity name>:<run id>"). The token is unique per
      # invocation, so the wait_for below references the returned value.
      - activity:
          name: slow_lookup
          type: builtin.delay
          async_mode: true
          async_event_topic: order_events
          input_data:
            duration: 1s
          output_name: lookup_token

      - transform:
          name: log-token
          output_data:
            - lookup_token#: '{{ lookup_token }}'

      - wait_for:
          name: await-lookup
          event:
            topic: order_events
            event_type: '{{ lookup_token }}'
          timeout_sec: 30
          output_name: lookup_event

      - transform:
          name: read-lookup
          output_data:
            - lookup_status#: '{{ lookup_event.get("metadata", {}).get("status") if lookup_event else "timed-out" }}'

      # --- 3. the timeout path ------------------------------------------------
      # Nothing ever publishes this event, so wait_for returns None. This is a
      # normal result, not an error -- branch on it.
      - wait_for:
          name: await-something-that-never-comes
          event:
            topic: order_events
            event_type: cancelled
          timeout_sec: 2
          output_name: cancel_event

      - transform:
          name: build-report
          output_data:
            - report:
                order_id: '{{ order_id }}'
                fulfilment: '{{ fulfilment }}'
                lookup_status: '{{ lookup_status }}'
                cancelled: '{{ cancel_event is not None }}'
                timed_out_as_expected: '{{ cancel_event is None }}'

# Ordering note: a wait_for only sees events published after it starts waiting,
# and an async producer that finishes first will have its event dropped. Keep
# the gap small, or give the producer a delay, as the child above does.
