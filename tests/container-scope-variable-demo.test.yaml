test_type: integration-test

wfspec:
  name: container-scope-variable-demo
  version: 1.0.0

test_cases:
  # Happy path: all three orders processed with correct discounts
  - id: processes-all-orders
    input: {}
    expect:
      assert:
        - "{{ processed_orders is not None }}"
        - "{{ len(processed_orders) == 3 }}"
        - "{{ total_revenue is not None }}"
        - "{{ total_revenue > 0 }}"

  # Verify 10% discount applied to orders >= $100 (Alice: $150 → $135, Carol: $250 → $225)
  - id: discount-applied-to-large-orders
    input: {}
    expect:
      assert:
        - "{{ next(o for o in processed_orders if o['customer'] == 'Alice')['discount_pct'] == 10 }}"
        - "{{ next(o for o in processed_orders if o['customer'] == 'Carol')['discount_pct'] == 10 }}"
        - "{{ round(next(o for o in processed_orders if o['customer'] == 'Alice')['final'], 2) == 135.0 }}"

  # Verify no discount for orders under $100 (Bob: $49.99 → $49.99)
  - id: no-discount-for-small-orders
    input: {}
    expect:
      assert:
        - "{{ next(o for o in processed_orders if o['customer'] == 'Bob')['discount_pct'] == 0 }}"
        - "{{ round(next(o for o in processed_orders if o['customer'] == 'Bob')['final'], 2) == 49.99 }}"

  # Verify total revenue sums all final prices
  - id: total-revenue-calculation
    input: {}
    expect:
      assert:
        - "{{ round(total_revenue, 2) == round(135.0 + 49.99 + 225.0, 2) }}"
        - "{{ summary['total_orders'] == 3 }}"
